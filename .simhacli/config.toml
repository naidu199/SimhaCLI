# ═══════════════════════════════════════════════════════════════════════
# SimhaCLI Project Configuration
# ═══════════════════════════════════════════════════════════════════════
# This file is inside .simhacli/ which is gitignored - keys are safe!
# Uncomment lines to activate them by removing the '#' at the beginning

# ───────────────────────────────────────────────────────────────────────
# MODEL CONFIGURATION
# ───────────────────────────────────────────────────────────────────────
[model]
name = "openrouter/healer-alpha"
# temperature = 1.0
# context_window = 256000

# ───────────────────────────────────────────────────────────────────────
# HOOKS SYSTEM
# ───────────────────────────────────────────────────────────────────────
hooks_enabled = true

[[hooks]]
name = "test_before_tool"
trigger = "before_tool"
command = "python3 ./scripts/test_tool.py"
enabled = true

[[hooks]]
name = "test_before_agent"
trigger = "before_agent"
command = "python3 ./scripts/test_tool.py"
enabled = true

# ───────────────────────────────────────────────────────────────────────
# MCP SERVERS
# Uncomment and add your credentials, then restart SimhaCLI
# ───────────────────────────────────────────────────────────────────────

# Filesystem MCP - File access within allowed directories
[mcp_servers.filesystem]
command = "npx"
args = [
    "-y",
    "@modelcontextprotocol/server-filesystem",
    "D:/mine/SimhaCLI",
]
enabled = true

